---

# jenkins variables
project_name: docker-obsidian
external_type: github_stable
release_type: stable
release_tag: latest
ls_branch: main
build_armhf: false
external_artifact_check: |
  assets=$(curl -u "${{ '{{' }} secrets.CR_USER {{ '}}' }}:${{ '{{' }} secrets.CR_PAT {{ '}}' }}" -sX GET "https://api.github.com/repos/obsidianmd/obsidian-release/releases/tags/${EXT_RELEASE}" | jq -r '.assets[].browser_download_url')
  if grep -q "arm64.AppImage" <<< "${assets}"; then
    artifacts_found="true"
  else
    artifacts_found="false"
  fi
repo_vars:
  - EXT_USER = 'obsidianmd'
  - EXT_REPO = 'obsidian-releases'
  - BUILD_VERSION_ARG = 'OBSIDIAN_VERSION'
  - LS_USER = 'linuxserver'
  - LS_REPO = 'docker-obsidian'
  - CONTAINER_NAME = 'obsidian'
  - DOCKERHUB_IMAGE = 'linuxserver/obsidian'
  - DEV_DOCKERHUB_IMAGE = 'lsiodev/obsidian'
  - PR_DOCKERHUB_IMAGE = 'lspipepr/obsidian'
  - DIST_IMAGE = 'ubuntu'
  - MULTIARCH = 'true'
  - CI = 'true'
  - CI_WEB = 'true'
  - CI_PORT = '3001'
  - CI_SSL = 'true'
  - CI_DELAY = '120'
  - CI_DOCKERENV = 'TZ=US/Pacific'
  - CI_AUTH = 'user:password'
  - CI_WEBPATH = ''
